<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Fallback colours for demo mode outside Telegram. Inside Telegram the
     user's own theme (--tg-theme-*) is used automatically. */
  :root {
    --f-bg: #eff1f5; --f-card: #ffffff; --f-text: #12161f; --f-hint: #7b8494;
    --f-accent: #2481cc; --f-accent-text: #ffffff; --f-danger: #e5484d; --f-sep: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --f-bg: #0e1015; --f-card: #1a1d24; --f-text: #eef0f4; --f-hint: #8a93a3;
            --f-accent: #4ea4f6; --f-accent-text: #ffffff; --f-danger: #ff6b6e; --f-sep: rgba(255,255,255,.08); }
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-card)));
    --text: var(--tg-theme-text-color, var(--f-text));
    --hint: var(--tg-theme-hint-color, var(--f-hint));
    --accent: var(--tg-theme-button-color, var(--f-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--f-accent-text));
    --link: var(--tg-theme-link-color, var(--accent));
    --danger: var(--tg-theme-destructive-text-color, var(--f-danger));
    --sep: var(--f-sep);
    --good: #22a25a; --good-bg: rgba(34,162,90,.14);
    --mid: #d18a0b;  --mid-bg: rgba(209,138,11,.15);
    --bad: #e5484d;  --bad-bg: rgba(229,72,77,.14);
    --info: #6b7cff; --info-bg: rgba(107,124,255,.15);
    --hw: #c060e0;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .hint { color: var(--hint); }
  .muted { color: var(--hint); font-size: 13px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; }
  .school { font-weight: 600; font-size: 14px; color: var(--hint); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .langs { display: flex; background: var(--card); border-radius: 10px; padding: 2px; }
  .langs button { padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--hint); border-radius: 8px; }
  .langs button.on { background: var(--accent); color: var(--accent-text); }
  .icon-btn { width: 32px; height: 32px; border-radius: 10px; background: var(--card); display: grid; place-items: center; color: var(--hint); }
  .icon-btn svg { width: 18px; height: 18px; }
  .spin svg { animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .demo { background: var(--info-bg); color: var(--text); border-radius: 12px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }

  /* child switcher */
  .kids { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
  .kids::-webkit-scrollbar { display: none; }
  .kid { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: 14px; }
  .kid.on { background: var(--accent); color: var(--accent-text); }

  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

  /* hero */
  .hero { display: flex; gap: 14px; align-items: center; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
  .name { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--text); }
  .tag.warn { background: var(--mid-bg); color: var(--mid); }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--sep); }
  .info .k { font-size: 12px; color: var(--hint); }
  .info .v { font-weight: 500; overflow-wrap: anywhere; }
  .info .wide { grid-column: 1 / -1; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 10px; }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .stat .cmp { font-size: 12px; color: var(--hint); margin-top: 6px; }
  .stat .cmp b { color: var(--text); font-weight: 600; }
  .bar { height: 4px; border-radius: 4px; background: var(--bg); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }

  .note .k { font-size: 12px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }

  /* tabs */
  .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 2; box-shadow: 0 0 0 8px var(--bg); }
  .tabs button { flex: 1; padding: 8px 2px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--hint); position: relative; white-space: nowrap; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-left: 4px; vertical-align: 2px; }

  /* lists */
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .row { padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; }
  .row .s { font-size: 13px; color: var(--hint); }
  .row .c { font-size: 13px; margin-top: 4px; font-style: italic; color: var(--text); opacity: .85; }
  .score { text-align: right; flex: none; }
  .score .big { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 3px; }
  .g { color: var(--good); background: var(--good-bg); }
  .m { color: var(--mid); background: var(--mid-bg); }
  .b { color: var(--bad); background: var(--bad-bg); }
  .i { color: var(--info); background: var(--info-bg); }
  .empty { padding: 28px 16px; text-align: center; color: var(--hint); }

  .att-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .att-sum span { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; }

  .chart { padding: 14px 16px 10px; }
  .chart .k { font-size: 12px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; }
  .chart svg { display: block; width: 100%; height: 96px; margin-top: 8px; overflow: visible; }
  .chart .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 4px; }

  .news .t { font-size: 16px; }
  .news .msg { margin-top: 6px; white-space: pre-wrap; }

  /* actions */
  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px; }
  .btn:disabled { opacity: .6; }
  .btn.ghost { background: var(--card); color: var(--link); }
  .link-danger { color: var(--danger); font-size: 14px; padding: 6px; }

  /* connect screen */
  .connect { text-align: center; padding-top: 6vh; }
  .connect .badge { width: 76px; height: 76px; border-radius: 24px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; margin: 0 auto 18px; }
  .connect .badge svg { width: 40px; height: 40px; }
  .connect h1 { font-size: 22px; margin: 0 0 6px; }
  .connect p { margin: 0 auto 22px; color: var(--hint); max-width: 320px; }
  .code { width: 100%; padding: 15px; font: 600 24px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .25em; text-align: center; text-transform: uppercase;
    background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 14px; outline: none; margin-bottom: 12px; }
  .code:focus { border-color: var(--accent); }
  .code::placeholder { letter-spacing: .05em; font-size: 16px; color: var(--hint); font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 10px; }

  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--hint); }
  .loader { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--card); border-top-color: var(--accent); animation: rot .8s linear infinite; margin: 0 auto 12px; }
  /* payments */
  .paycard { display: flex; align-items: center; gap: 12px; }
  .paycard .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: none; }
  .paycard .main { flex: 1; min-width: 0; }
  .paycard .k { font-size: 12px; color: var(--hint); }
  .paycard .amt { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .paycard .when { font-size: 13px; color: var(--hint); }
  .paycard.over { box-shadow: inset 0 0 0 2px var(--bad); }
  .admin { display: flex; align-items: center; gap: 10px; background: var(--info-bg); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .admin span { flex: 1; }
  .admin button { color: var(--link); font-weight: 600; font-size: 13px; }
  /* staff + forms */
  .modes { display: flex; background: var(--card); border-radius: 10px; padding: 2px; }
  .modes button { padding: 4px 9px; font-size: 12px; font-weight: 600; color: var(--hint); border-radius: 8px; white-space: nowrap; }
  .modes button.on { background: var(--accent); color: var(--accent-text); }
  .back { color: var(--link); font-weight: 600; font-size: 15px; padding: 4px 0 10px; display: inline-flex; gap: 4px; }
  .h1 { font-size: 21px; font-weight: 700; margin: 2px 0 2px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 12px; }
  .sec { font-size: 12px; font-weight: 700; color: var(--hint); text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; display: flex; align-items: center; justify-content: space-between; }
  .sec button { color: var(--link); font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 10px; }
  .kpi .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi .l { font-size: 11.5px; color: var(--hint); margin-top: 2px; line-height: 1.25; }
  .kpi.alert .n { color: var(--bad); }
  .navgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .navgrid button { background: var(--card); border-radius: 14px; padding: 14px 12px; text-align: left; font-weight: 600; font-size: 15px; position: relative; }
  .navgrid button .e { font-size: 20px; display: block; margin-bottom: 4px; }
  .navgrid .cnt { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; border-radius: 9px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 5px; }
  .row.tap { cursor: pointer; }
  .row .chev { color: var(--hint); flex: none; align-self: center; }
  .pills { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin: 0 2px 5px; }
  .field label i { color: var(--danger); font-style: normal; }
  .field .hint { font-size: 12px; margin: 4px 2px 0; }
  .inp, .sel, .txt { width: 100%; padding: 11px 12px; font: inherit; color: var(--text); background: var(--card); border: 1.5px solid transparent; border-radius: 12px; outline: none; }
  .inp:focus, .sel:focus, .txt:focus { border-color: var(--accent); }
  .bad .inp, .bad .sel, .bad .txt, .bad .chips, .bad .seg2 { border-color: var(--danger) !important; }
  .bad label { color: var(--danger); }
  .txt { min-height: 84px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; border: 1.5px solid transparent; border-radius: 12px; }
  .chips button { padding: 8px 12px; border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 500; }
  .chips button.on { background: var(--accent); color: var(--accent-text); }
  .seg2 { display: flex; background: var(--card); border-radius: 12px; padding: 3px; border: 1.5px solid transparent; }
  .seg2 button { flex: 1; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); }
  .seg2 button.on { background: var(--accent); color: var(--accent-text); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; background: var(--card); padding: 12px; border-radius: 12px; border: 1.5px solid transparent; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
  .field label.check { font-weight: 400; margin: 0; }
  .bad .check { border-color: var(--danger); }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .stu { padding: 12px 14px; }
  .stu .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .stu .nm { font-weight: 700; }
  .att { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
  .att button { padding: 9px 2px; border-radius: 10px; background: var(--bg); font-size: 12.5px; font-weight: 700; color: var(--hint); }
  .att button.on.present { background: var(--good-bg); color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
  .att button.on.late { background: var(--mid-bg); color: var(--mid); box-shadow: inset 0 0 0 1.5px var(--mid); }
  .att button.on.absent { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
  .att button.on.excused { background: var(--info-bg); color: var(--info); box-shadow: inset 0 0 0 1.5px var(--info); }
  .nums3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
  .nums3 .inp, .stu .inp { padding: 9px 10px; background: var(--bg); font-size: 15px; }
  .mini { font-size: 11px; color: var(--hint); margin: 0 2px 3px; font-weight: 600; }
  .savebar { position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 8px; }
  .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px 10px; font-size: 14px; }
  .kv .k { color: var(--hint); }
  .kv a { color: var(--link); text-decoration: none; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--hint); font-size: 13px; margin: 22px 0 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--sep); }
  .okbox { text-align: center; padding: 28px 16px; }
  .okbox .big { font-size: 46px; }
  .code-chip { font: 700 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; background: var(--bg); padding: 4px 10px; border-radius: 8px; }
  .spinwrap { padding: 40px 0; text-align: center; color: var(--hint); }
  /* lessons */
  .lesson .when { font-weight: 600; }
  .lesson .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
  .lesson .nums { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex: none; }
  .num { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .num span { font-weight: 500; opacity: .8; margin-right: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--hint); margin-top: 10px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .chart svg.big { height: 170px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .mtable { table-layout: fixed; }
  .mtable th { font-size: 11px; font-weight: 600; color: var(--hint); text-align: right; padding: 10px 10px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtable th:first-child, .mtable td:first-child { text-align: left; }
  .mtable td { padding: 9px 10px; text-align: right; border-top: 1px solid var(--sep); }
  .mtable th:first-child, .mtable td:first-child { width: 34%; padding-left: 16px; }

  /* iPhone: inputs must be allowed to shrink inside grids (date/time fields had a fixed native width and overlapped) */
  .formgrid > *, .nums3 > *, .grid3 > * { min-width: 0; }
  .inp, .sel { min-width: 0; max-width: 100%; }
  input[type="date"].inp { -webkit-appearance: none; appearance: none; display: block; min-height: 44px; line-height: 1.3; }
  input[type="date"].inp::-webkit-date-and-time-value { text-align: left; }
  .nums3 input[type="date"].inp, .stu input[type="date"].inp { min-height: 40px; }
  .inp.t { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .grid3 { display: grid; grid-template-columns: 1.25fr 1fr 1fr 34px; gap: 6px; align-items: end; margin-bottom: 6px; }
  .grid3 .x { height: 40px; border-radius: 10px; background: var(--bg); color: var(--hint); font-size: 16px; }
  .grid3 .inp, .grid3 .sel { padding: 9px 8px; background: var(--bg); }
  /* status: cancelled */
  .x { color: var(--hint); background: rgba(128,128,128,.14); }
  .row.cancelled .when, .row.cancelled .t { text-decoration: line-through; text-decoration-color: rgba(128,128,128,.7); }
  .no { font-size: 11px; font-weight: 700; color: var(--hint); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .stale { font-size: 11px; font-weight: 600; color: var(--hint); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .stale::before { content: ''; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--hint); border-top-color: transparent; animation: rot .8s linear infinite; }
  .stale.off::before { display: none; }
  .banner { border-radius: 14px; padding: 14px; margin-bottom: 12px; background: rgba(128,128,128,.12); }
  .banner .t { font-weight: 700; }
  /* week calendar */
  .wknav { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; margin-bottom: 10px; }
  .wknav button { height: 38px; border-radius: 12px; background: var(--card); font-weight: 600; }
  .wknav .mid { font-size: 14px; color: var(--link); }
  .tchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px; scrollbar-width: none; }
  .tchips::-webkit-scrollbar { display: none; }
  .tchips button { flex: none; padding: 6px 11px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .tchips button.on { box-shadow: inset 0 0 0 2px var(--accent); }
  .tchips i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .wk { background: var(--card); border-radius: var(--radius); padding: 8px 6px 10px 0; margin-bottom: 12px; }
  .wk .head { display: grid; grid-template-columns: 30px repeat(7, 1fr); margin-bottom: 4px; }
  .wk .head button { padding: 4px 0; border-radius: 9px; font-size: 11px; color: var(--hint); line-height: 1.15; }
  .wk .head button b { display: block; font-size: 15px; color: var(--text); }
  .wk .head button.today b { color: var(--accent); }
  .wk .head button.on { background: var(--accent); color: var(--accent-text); }
  .wk .head button.on b { color: var(--accent-text); }
  .wk .body { display: grid; grid-template-columns: 30px repeat(7, 1fr); position: relative; }
  .wk .hours { position: relative; }
  .wk .hours span { position: absolute; right: 4px; font-size: 9.5px; color: var(--hint); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
  .wk .col { position: relative; border-left: 1px solid var(--sep); }
  .wk .col.on { background: rgba(128,128,128,.07); }
  .wk .line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--sep); }
  .wk .ev { position: absolute; border-radius: 6px; padding: 2px 3px; font-size: 9.5px; line-height: 1.15; color: #1d2330; overflow: hidden; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .wk .ev b { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wk .ev.cancelled { opacity: .45; text-decoration: line-through; background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,.08) 5px 7px) !important; }

function viewDash() {
  const kids = state.data.students;
  const s = kids.find(k => k.id === state.kid) || kids[0];
  let html = topBar(true);
  if (kids.length > 1) {
    html += `<div class="kids">${kids.map(k => `<button class="kid ${k.id === s.id ? 'on' : ''}" data-kid="${esc(k.id)}">${esc(k.name.split(' ')[0])}</button>`).join('')}</div>`;
  }
  html += studentBody(s, state.data.announcements, '');
  html += `<div class="actions">
    <button class="btn ghost" data-act="add">＋ ${esc(t('addChild'))}</button>
    <button class="link-danger" data-act="remove" data-id="${esc(s.id)}">${esc(t('remove', { name: s.name.split(' ')[0] }))}</button>
  </div>`;
  return html;
}

/** A student's page (parents, and admins via Students). news = null hides the News tab; extra = HTML after the stats. */
function studentBody(s, news, extra) {
  const st = s.stats || {};
  const status = String(s.status || '').toLowerCase();
  if (!news && state.tab === 'news') state.tab = 'lessons';
  let html = `<div class="card">
    <div class="hero">
      <div class="avatar">${esc(initials(s.name))}</div>
      <div style="min-width:0">
        <div class="name">${esc(s.name)}</div>
        <div class="tags">
          ${s.level ? `<span class="tag">${esc(s.level)}</span>` : ''}
          ${s.group ? `<span class="tag">${esc(s.group)}</span>` : `<span class="tag">${esc(t('individual'))}</span>`}
          ${s.course ? `<span class="tag">${esc(s.course)}</span>` : ''}
          ${status && status !== 'active' ? `<span class="tag warn">${esc(statusLabel(s.status))}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="info">
      ${s.teacher ? `<div><div class="k">${esc(t('teacher'))}</div><div class="v">${esc(s.teacher)}</div></div>` : ''}
      ${s.room ? `<div><div class="k">${esc(t('room'))}</div><div class="v">${esc(s.room)}</div></div>` : ''}
      ${s.schedule ? `<div class="wide"><div class="k">${esc(t('schedule'))}</div><div class="v">${esc(s.schedule)}</div></div>` : ''}
      ${s.startDate ? `<div class="wide"><div class="k">${esc(t('since'))}</div><div class="v">${fmtDate(s.startDate, { month: 'long', year: 'numeric' })}</div></div>` : ''}
    </div>
  </div>`;

  const tile = (value, label, pct, cmp) => `<div class="stat">
    <div class="n">${value}</div><div class="l">${esc(label)}</div>
    ${pct !== undefined ? `<div class="bar"><i style="width:${pct == null ? 0 : Math.max(0, Math.min(100, pct))}%;background:${toneColor(pct)}"></i></div>` : ''}
    ${cmp ? `<div class="cmp">${cmp}</div>` : ''}
  </div>`;
  const grp = v => v == null ? '' : `${esc(t('groupAvg'))}: <b>${Math.round(v)}%</b>`;
  html += `<div class="stats">
    ${tile(pctText(st.attendanceRate), t('attendance'), st.attendanceRate)}
    ${tile(st.late || 0, t('lateTimes'), undefined, st.avgMinutesLate ? esc(t('avgLate', { n: Math.round(st.avgMinutesLate) })) : '')}
    ${tile(pctText(st.homework), t('homework'), st.homework, grp(st.groupHomework))}
    ${tile(pctText(st.mark), t('mark'), st.mark, grp(st.groupMark))}
  </div>`;

  html += extra || '';
  html += weekCard(s);
  html += payCard(s);
  if (s.comment) html += `<div class="card note"><div class="k">${esc(t('schoolNote'))}</div><div>${esc(s.comment)}</div></div>`;

  html += `<div class="tabs">
    <button data-tab="lessons" class="${state.tab === 'lessons' ? 'on' : ''}">${esc(t('lessons'))}</button>
    <button data-tab="progress" class="${state.tab === 'progress' ? 'on' : ''}">${esc(t('progress'))}</button>
    <button data-tab="payments" class="${state.tab === 'payments' ? 'on' : ''}">${esc(t('payments'))}</button>
    ${news ? `<button data-tab="news" class="${state.tab === 'news' ? 'on' : ''}">${esc(t('news'))}${news.length && state.tab !== 'news' ? `<span class="dot"></span>` : ''}</button>` : ''}
  </div>`;

  if (state.tab === 'lessons') html += tabLessons(s);
  else if (state.tab === 'progress') html += tabProgress(s);
  else if (state.tab === 'payments') html += tabPayments(s);
  else html += tabNews(news);
  return html;
}

function weekCard(s) {
  const w = s.week;
  if (!w) return '';
  const head = `<div class="sec" style="margin-top:4px">${esc(t('thisWeek'))}</div>`;
  if (!w.length) return head + `<div class="list"><div class="empty" style="padding:16px">${esc(t('noWeek'))}</div></div>`;
  const today = todayIso();
  return head + `<div class="list wkcard">${w.map(i => `<div class="row ${i.status === 'cancelled' || i.status === 'moved' ? 'cancelled' : ''}">
    <div class="day">${i.date === today ? esc(t('todayBtn')) : fmtDate(i.date, { weekday: 'short', day: 'numeric', month: 'short', year: false })}</div>
    <div class="main"><div class="t">${span(i)}</div><div class="s">${esc(i.kind === 'individual' ? t('individual') : i.group)}${i.teacher ? ' · ' + esc(i.teacher) + (i.substitute ? ' (' + esc(t('subShort')) + ')' : '') : ''}${i.room ? ' · ' + esc(i.room) : ''}</div></div>
    ${i.status === 'cancelled' ? `<span class="pill x" style="margin-top:0">${esc(t('cancelled'))}</span>` : i.status === 'moved' && i.movedTo ? `<span class="pill x" style="margin-top:0">→ ${fmtDate(i.movedTo.date, { weekday: 'short', day: 'numeric', month: 'short', year: false })} ${esc(i.movedTo.start)}</span>` : i.status === 'done' ? `<span class="pill g" style="margin-top:0">✓</span>` : i.change === 'extra' ? `<span class="pill i" style="margin-top:0">➕</span>` : ''}
  </div>`).join('')}</div>`;
}

        ${l.start ? `<span class="muted">${span(l)}${l.status === 'late' && l.arrival ? ' · → ' + esc(l.arrival) : ''}</span>` : ''}

function tabProgress(s) {
  const ms = s.monthly || [];
  const st = s.stats || {};
  if (!ms.length) return `<div class="list"><div class="empty">${esc(t('noProgress'))}</div></div>`;
  let html = `<div class="list chart"><div class="k">${esc(t('byMonth'))}</div>${monthChart(ms)}
    <div class="legend">
      <span><i style="background:var(--accent)"></i>${esc(t('markLine'))}</span>
      <span><i style="background:var(--hw)"></i>${esc(t('hwLine'))}</span>
      <span><i style="background:var(--good)"></i>${esc(t('attLine'))}</span>
    </div></div>`;
  html += `<div class="att-sum">
    <span class="g">${esc(t('present'))}: ${st.present || 0}</span>
    <span class="m">${esc(t('late'))}: ${st.late || 0}</span>
    <span class="b">${esc(t('absent'))}: ${st.absent || 0}</span>
    <span class="i">${esc(t('excused'))}: ${st.excused || 0}</span>
    ${st.cancelled ? `<span class="x">${esc(t('cancelled'))}: ${st.cancelled}</span>` : ''}
  </div>`;
  html += `<div class="list"><table class="mtable"><thead><tr>
      <th>${esc(t('month'))}</th><th>${esc(t('attShort'))}</th><th>${esc(t('hwShort'))}</th><th>${esc(t('markShort'))}</th></tr></thead>
    <tbody>${ms.slice().reverse().map(m => `<tr>
      <td>${monthLabel(m.month, true)}</td>
      <td><span class="num ${tone(m.attendance)}">${pctText(m.attendance)}</span></td>
      <td><span class="num ${tone(m.homework)}">${pctText(m.homework)}</span></td>
      <td><span class="num ${tone(m.mark)}">${pctText(m.mark)}</span></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}

function monthChart(ms) {
  const W = 320, H = 170, L = 30, R = 10, Tp = 10, B = 24;
  const n = ms.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  const y = v => Tp + (H - Tp - B) * (1 - v / 100);
  const series = [['mark', 'var(--accent)', ''], ['homework', 'var(--hw)', ''], ['attendance', 'var(--good)', '4 4']];
  let g = '';
  [0, 50, 100].forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--hint)">${v}</text>`;
  });
  ms.forEach((m, i) => { g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--hint)">${esc(monthLabel(m.month))}</text>`; });
  series.forEach(([key, color, dash]) => {
    const pts = ms.map((m, i) => m[key] == null ? null : [x(i), y(m[key])]).filter(Boolean);
    if (pts.length > 1) g += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    pts.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>`; });
  });
  return `<svg class="big" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('byMonth'))}">${g}</svg>`;
}

function payCard(s) {
  const ps = s.payments || [];
  if (!ps.length) return '';
  const unpaid = ps.filter(p => !p.paid).sort((a, b) => a.due < b.due ? -1 : 1);
  if (!unpaid.length) {
    return `<div class="card paycard"><div class="ico g">✓</div><div class="main"><div class="k">${esc(t('payments'))}</div>
      <div style="font-weight:600">${esc(t('allPaid'))}</div></div></div>`;
  }
  const p = unpaid[0];
  const tone = PAY_TONE[p.status] || 'i';
  return `<div class="card paycard ${p.status === 'overdue' ? 'over' : ''}">
    <div class="ico ${tone}">${p.status === 'overdue' ? '!' : '💳'}</div>
    <div class="main"><div class="k">${esc(t('nextPayment'))}</div>
      <div class="amt">${money(p.amount)}</div>
      <div class="when">${fmtDate(p.due, { weekday: 'short', day: 'numeric', month: 'long' })}</div></div>
    <span class="pill ${tone}" style="margin-top:0">${esc(payWhen(p))}</span>
  </div>`;
}

function tabPayments(s) {
  const ps = s.payments || [];
  if (!ps.length) return `<div class="list"><div class="empty">${esc(t('noPayments'))}</div></div>`;
  return `<div class="list">${ps.map(p => `<div class="row" style="align-items:center">
    <div class="main">
      <div class="t">${fmtDate(p.due, { day: 'numeric', month: 'long' })}</div>
      <div class="s">${esc(payWhen(p))}</div>
    </div>
    <div class="score">
      <div class="big">${money(p.amount)}</div>
      <span class="pill ${PAY_TONE[p.status] || 'i'}">${esc(t('st_' + p.status))}</span>
    </div>
  </div>`).join('')}</div><div class="muted" style="text-align:center;margin:-2px 0 8px">${esc(t('payNote'))}</div>`;
}

function tabNews(list) {
  if (!list.length) return `<div class="list"><div class="empty">${esc(t('noNews'))}</div></div>`;
  return list.map(a => `<div class="card news">
    <div class="s muted">${fmtDate(a.date, { day: 'numeric', month: 'long' })}${a.audience && a.audience.toLowerCase() !== 'all' ? ` · ${esc(t('forGroup', { group: a.audience }))}` : ''}</div>
    <div class="t" style="font-weight:700;margin-top:2px">${esc(a.title)}</div>
    <div class="msg">${esc(a.message)}</div>
  </div>`).join('');
}

/* ---------------- routing between family / work / connect ---------------- */
function route() {
  const d = state.data || { students: [] };
  if (d.staff && (state.mode === 'staff' || !d.students.length)) {
    state.mode = 'staff'; state.view = 'staff';
    if (!state.sv) { state.svStack = []; openStaff('home', {}, false); }
  } else if (d.students.length) {
    state.mode = 'parent'; state.view = 'dash';
  } else {
    state.view = 'connect';
  }
  store.set('mode', state.mode);
}

async function phoneLogin() {
  state.error = null;
  if (DEMO) return doPhone('demo');
  try {
    tg.requestContact(function (ok, res) {
      if (!ok) return;
      const signed = res && res.response;
      if (!signed) { state.error = 'phone_old_app'; state.showCode = true; render(); return; }
      doPhone(signed);
    });
  } catch (e) { state.error = 'phone_old_app'; state.showCode = true; render(); }
}
async function doPhone(contact) {
  state.busy = true; render();
  try {
    const data = await api('phone_login', { contact: contact });
    setData(data);
    state.mode = data.phoneLinked && data.phoneLinked.staff ? 'staff' : 'parent';
    state.sv = null;
    route(); haptic('success'); askWriteAccess();
  } catch (e) { state.error = e.code || 'server_error'; state.showCode = true; haptic('error'); }
  state.busy = false; render();
}

/* ---------------- staff screens ---------------- */
const STAFF_API = {
  home: () => api('staff_home'),
  week: p => api('week', { start: p.start || '' }),
  group: p => api('group', { group: p.group }),
  groupedit: p => api('group_form', { group: p.group || '' }),
  lesson: p => api('lesson_get', { group: p.group, date: p.date, studentId: p.studentId }),
  indnew: () => api('student_pick'),
  students: () => api('students'),
  student: p => api('student', { studentId: p.studentId }),
  payments: () => api('payments'),
  announce: () => api('students'),
  regs: () => api('registrations'),
  reg: () => Promise.resolve(null),
  trials: () => api('trials'),
  trial: p => api('trial_get', { id: p.id }),
  trialnew: () => api('trials'),
  extranew: () => Promise.resolve({ ok: true }),
  hours: p => api('hours', { month: p.month || '' })
};
/* screens that only show data: they may open with the last-seen copy while the fresh one loads */
const READ_ONLY = { home: 1, week: 1, group: 1, students: 1, student: 1, trials: 1, hours: 1 };
function cacheKey(v) { return 's_' + v.name + '|' + (v.group || '') + '|' + (v.studentId || '') + '|' + (v.start || '') + '|' + (v.month || ''); }
function applyStaff(name, d) {
  state.sd = d;
  if (name === 'lesson') state.lesson = JSON.parse(JSON.stringify(d));
  if (name === 'indnew') state.pick = newPick(d);
  if (name === 'home') state.home = d;
  if (name === 'groupedit') state.gf = groupFormState(d);
  if (name === 'trial') state.trial = trialFormState(d);
  if (name === 'trialnew') state.tn = newTrialState(d, state.sv);
  if (name === 'extranew') state.ex = { date: todayIso(1), start: '', end: '', note: '' };
}
async function openStaff(name, params, push, opt) {
  opt = opt || {};
  const moved = push !== false || opt.top;
  if (push !== false && state.sv) state.svStack.push(state.sv);
  state.sv = Object.assign({}, params || {}, { name: name });
  const my = ++state.reqId;
  state.q = '';
  if (name === 'student' && moved) state.tab = 'lessons';
  if (name === 'week' && moved) state.wk = { teacher: state.wk.teacher, day: '' };
  if (name === 'home' && state.freshHome) {          // came with "me": no second request
    applyStaff('home', state.freshHome); state.freshHome = null;
    state.sLoading = false; render(); if (moved) window.scrollTo(0, 0);
    return;
  }
  const old = READ_ONLY[name] ? saved.get(cacheKey(state.sv)) : null;
  if (old) { applyStaff(name, old); state.sLoading = false; state.stale = true; }
  else { state.sLoading = true; state.stale = false; }
  render(); if (moved) window.scrollTo(0, 0);
  try {
    const d = await STAFF_API[name](state.sv);
    if (my !== state.reqId) return;                 // the user already went somewhere else
    if (d) { applyStaff(name, d); if (READ_ONLY[name]) saved.set(cacheKey(state.sv), d); }
    state.offline = false;
  } catch (e) {
    if (my !== state.reqId) return;
    if (old) state.offline = true;
    else { toast(t(e.code || 'server_error')); if (state.svStack.length) { state.sv = state.svStack.pop(); if (state.sv.name === 'home' && state.home) state.sd = state.home; } }
  }
  state.sLoading = false; state.stale = false; render();
}
async function refreshStaff() { const cur = state.sv; await openStaff(cur.name, cur, false); }
function todayIso(plusDays) {
  const d = new Date(); d.setDate(d.getDate() + (plusDays || 0));
  return ymd(d);
}
const backLink = () => `<button class="back" data-act="sback">‹ ${esc(t('back'))}</button>`;
const chev = '<span class="chev">›</span>';

function viewStaff() {
  let html = topBar(true);
  const v = state.sv || { name: 'home' };
  if (v.name !== 'home') html += backLink();
  if (state.sLoading) return html + `<div class="spinwrap"><div class="loader"></div>${esc(t('loading'))}</div>`;
  const d = state.sd || {};
  switch (v.name) {
    case 'home': return html + staffHome(d);
    case 'week': return html + viewWeek(d);
    case 'group': return html + staffGroup(d);
    case 'groupedit': return html + groupEdit(d);
    case 'lesson': return html + lessonEditor();
    case 'indnew': return html + indNew();
    case 'students': return html + adminStudents(d);
    case 'student': return html + adminStudent(d.student);
    case 'payments': return html + adminPayments(d);
    case 'announce': return html + announceForm(d);
    case 'regs': return html + adminRegs(d);
    case 'reg': return html + regDetail();
    case 'trials': return html + trialsView(d);
    case 'trial': return html + trialView(d);
    case 'trialnew': return html + trialNewView();
    case 'extranew': return html + extraView();
    case 'hours': return html + hoursView(d);
  }
  return html;
}
const isAdmin = () => !!(state.data && state.data.staff && state.data.staff.role === 'admin');

function staffHome(d) {
  const admin = d.staff && d.staff.role === 'admin';
  let html = `<div class="h1">${esc(t('hello', { name: d.staff ? d.staff.name : '' }))}</div>
    <div class="sub">${esc(t(admin ? 'roleAdmin' : 'roleTeacher'))} · ${fmtDate(d.today, { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;
  if (admin && d.kpis) {
    const k = d.kpis;
    const tile = (n, l, cls) => `<div class="kpi ${cls || ''}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
    html += `<div class="kpis">
      ${tile(k.activeStudents, t('kStudents'))}
      ${tile(pctText(k.attendance), t('kAtt'))}

      <button data-act="go" data-v="announce"><span class="e">📢</span>${esc(t('navAnnounce'))}</button>
      <button data-act="go" data-v="regs"><span class="e">📝</span>${esc(t('navRegs'))}${k.newRegistrations ? `<span class="cnt">${k.newRegistrations}</span>` : ''}</button>
      <button data-act="go" data-v="trials"><span class="e">🎓</span>${esc(t('trials'))}${trCnt ? `<span class="cnt">${trCnt}</span>` : ''}</button>
      <button data-act="go" data-v="hours"><span class="e">⏱</span>${esc(t('hours'))}</button>
    </div>`;

  if ((d.covering || []).length) {
    html += `<div class="sec">👤 ${esc(t('covering'))}</div><div class="list">${d.covering.map(i => `<div class="row tap" data-act="go" data-v="lesson" data-group="${esc(i.group)}" data-date="${esc(i.date)}" data-sid="${esc(i.studentId || '')}">
      <div class="main"><div class="t">${esc(i.kind === 'group' ? i.group : i.name)}</div><div class="s">${fmtDate(i.date, { weekday: 'short', day: 'numeric', month: 'short' })} · ${span(i)} · ${esc(t('subFor', { name: i.usualTeacher }))}</div></div>
      ${i.status !== 'planned' ? `<span class="pill ${ST_CLS[i.status] || 'i'}" style="margin-top:0">${esc(t(WK_LABEL[i.status] || i.status))}</span>` : ''}${chev}</div>`).join('')}</div>`;
  }
  if (tr.upcoming.length) html += `<div class="sec">🎓 ${esc(t('trials'))}<button data-act="go" data-v="trialnew">${esc(t('newTrial'))}</button></div><div class="list">${tr.upcoming.slice(0, 5).map(trialRow).join('')}</div>`;
  html += `<div class="sec">${esc(t('myGroups'))}${admin ? `<button data-act="go" data-v="groupedit">${esc(t('newGroup'))}</button>` : ''}</div>`;
  html += (d.groups || []).length ? `<div class="list">${d.groups.map(g => `<div class="row tap" data-act="go" data-v="group" data-group="${esc(g.name)}">
      <div class="main"><div class="t">${esc(g.name)} <span class="muted" style="font-weight:500">· ${esc(g.level)}</span></div>
      <div class="s">${esc(t('studentsN', { n: g.students }))}${admin && g.teacher ? ' · ' + esc(g.teacher) : ''}</div>
      ${g.schedule ? `<div class="s">${esc(g.schedule)}${g.room ? ' · ' + esc(g.room) : ''}</div>` : ''}</div>${chev}</div>`).join('')}</div>`
    : `<div class="list"><div class="empty">${esc(t('noGroups'))}</div></div>`;
  const ind = d.individual || { upcoming: [], recent: [] };
  const today = d.today || todayIso();
  const soon = ind.upcoming.filter(l => l.date <= addDays(today, 7));
  const shown = soon.slice(0, 8);
  html += `<div class="sec">${esc(t('indLessons'))}<button data-act="go" data-v="indnew">${esc(t('newInd'))}</button></div>`;
  const indRow = l => {
    const st = l.status || (l.date < today ? 'unmarked' : '');
    return `<div class="row tap ${l.status === 'cancelled' ? 'cancelled' : ''}" data-act="go" data-v="lesson" data-group="Individual" data-date="${esc(l.date)}" data-sid="${esc(l.studentId)}">
      <div class="main"><div class="t">${esc(l.name)}</div><div class="s">${fmtDate(l.date, { weekday: 'short', day: 'numeric', month: 'short' })}${l.start ? ' · ' + span(l) : ''}${admin && l.teacher ? ' · ' + esc(l.teacher) : ''}${l.substitute ? ' · 👤 ' + esc(l.substitute) : ''}${l.series ? ' · 🔁' : ''}</div></div>

  };
  if (!soon.length && !ind.recent.length) html += `<div class="list"><div class="empty">${esc(t('noInd'))}</div></div>`;
  if (shown.length) html += `<div class="mini" style="margin:0 4px 6px">${esc(t('planned'))}</div><div class="list">${shown.map(indRow).join('')}

  if (ind.recent.length) html += `<div class="mini" style="margin:0 4px 6px">${esc(t('recentDone'))}</div><div class="list">${ind.recent.map(indRow).join('')}</div>`;
  return html;
}

/* ---------- week timetable (teachers: own lessons; admins: everyone, with a teacher filter) ---------- */
function viewWeek(d) {
  const W = state.wk;
  const all = d.items || [];
  const teachers = d.teachers || [];
  const items = all.filter(i => !W.teacher || i.teacher === W.teacher || i.usualTeacher === W.teacher);
  const days = [0, 1, 2, 3, 4, 5, 6].map(k => addDays(d.from, k));
  if (!days.includes(W.day)) W.day = days.includes(d.today) ? d.today : (days.find(x => items.some(i => i.date === x)) || days[0]);
  const colour = n => (teachers.find(x => x.name === n) || {}).colour || '#E3E7EE';
  const mins = h => { const m = /^(\d{1,2}):(\d{2})/.exec(h || ''); return m ? +m[1] * 60 + +m[2] : null; };
  let lo = 8 * 60, hi = 21 * 60;
  items.forEach(i => { const a = mins(i.start); if (a == null) return; const b = mins(i.end) || a + 60; lo = Math.min(lo, Math.floor(a / 60) * 60); hi = Math.max(hi, Math.ceil(b / 60) * 60); });
  const PX = 0.6;   // 36 px per hour
  const admin = isAdmin();
  let html = `<div class="h1">${esc(t('timetable'))}</div><div class="sub">${fmtDate(d.from, { day: 'numeric', month: 'short', year: false })} – ${fmtDate(d.to, { day: 'numeric', month: 'short' })}</div>
    <div class="wknav"><button data-act="wkmove" data-v="-7" aria-label="‹">‹</button><button class="mid" data-act="wkmove" data-v="0">${esc(t('todayBtn'))}</button><button data-act="wkmove" data-v="7" aria-label="›">›</button></div>`;
  if (admin && teachers.length > 1) {
    html += `<div class="tchips"><button data-act="wkt" data-v="" class="${!W.teacher ? 'on' : ''}">${esc(t('allT'))}</button>${teachers.map(x => `<button data-act="wkt" data-v="${esc(x.name)}" class="${W.teacher === x.name ? 'on' : ''}"><i style="background:${esc(x.colour)}"></i>${esc(x.name)}</button>`).join('')}</div>`;
  }
  // grid
  let head = '<div></div>', cols = '';
  days.forEach(day => {
    const dt = parseDate(day);
    head += `<button data-act="wkday" data-v="${day}" class="${day === W.day ? 'on' : ''} ${day === d.today ? 'today' : ''}">${esc(t('d_' + WD[wdIdx(day)]))}<b>${dt.getDate()}</b></button>`;
    const evs = items.map((i, idx) => ({ i, idx, a: mins(i.start), b: mins(i.end) })).filter(e => e.i.date === day && e.a != null)
      .map(e => Object.assign(e, { b: e.b && e.b > e.a ? e.b : e.a + 60 })).sort((x, y) => x.a - y.a);
    // side-by-side columns for lessons at the same time
    let cluster = [], end = -1;
    const flush = () => { const c = []; cluster.forEach(e => { let k = 0; while (c[k] != null && c[k] > e.a) k++; c[k] = e.b; e.col = k; }); cluster.forEach(e => { e.n = c.length; }); cluster = []; };
    evs.forEach(e => { if (cluster.length && e.a >= end) { flush(); end = -1; } cluster.push(e); end = Math.max(end, e.b); });
    if (cluster.length) flush();
    let lines = '';
    for (let h = lo; h <= hi; h += 60) lines += `<div class="line" style="top:${(h - lo) * PX}px"></div>`;
    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    const now = day === d.today && nowM >= lo && nowM <= hi ? `<div class="now" style="top:${(nowM - lo) * PX}px"></div>` : '';
    cols += `<div class="col ${day === W.day ? 'on' : ''}" data-act="wkday" data-v="${day}">${lines}${now}${evs.map(e => {
      const label = e.i.kind === 'group' ? e.i.group : e.i.kind === 'trial' ? '🎓' + (e.i.name || '').split(' ')[0] : (e.i.name || '').split(' ')[0];
      return `<div class="ev ${e.i.status}" data-act="wkopen" data-i="${e.idx}" style="top:${(e.a - lo) * PX}px;height:${Math.max(16, (e.b - e.a) * PX - 1)}px;left:calc(${e.col / e.n * 100}% + 1px);width:calc(${100 / e.n}% - 2px);background:${esc(colour(e.i.teacher))}">${e.i.status === 'done' ? '✓' : ''}<b>${esc(e.i.start)}</b>${esc(label)}</div>`;
    }).join('')}</div>`;
  });
  let hours = '';
  for (let h = lo; h <= hi; h += 60) hours += `<span style="top:${(h - lo) * PX}px">${String(h / 60).padStart(2, '0')}</span>`;
  html += `<div class="wk"><div class="head">${head}</div><div class="body" style="height:${(hi - lo) * PX + 6}px"><div class="hours">${hours}</div>${cols}</div></div>`;
  // the chosen day in detail
  const list = items.map((i, idx) => ({ i, idx })).filter(e => e.i.date === W.day);
  html += `<div class="sec">${fmtDate(W.day, { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;
  html += list.length ? `<div class="list agenda">${list.map(({ i, idx }) => {
    const what = i.kind === 'group' ? [i.group, i.level, t('studentsN', { n: i.count })] : i.kind === 'trial' ? ['🎓 ' + t('trialTitle') + ': ' + i.name, i.mode === 'group' ? i.group : ''] : [i.name, i.level, i.course || t('indShort')];
    return `<div class="row tap ${i.status === 'cancelled' ? 'cancelled' : ''}" data-act="wkopen" data-i="${idx}">
      <span class="bar" style="background:${esc(colour(i.teacher))}"></span>
      <div class="tm">${esc(i.start)}<span>${esc(i.end)}</span></div>
      <div class="main"><div class="t">${esc(what.filter(Boolean).join(' · '))}</div>
      <div class="s">${i.substitute ? '👤 ' + esc(i.teacher) + ' · ' + esc(t('subFor', { name: i.usualTeacher })) + ' · ' : ''}${esc([admin && !i.substitute ? i.teacher : '', i.room, i.kind === 'individual' ? t('individual') : ''].filter(Boolean).join(' · '))}${i.series ? ' · 🔁 ' + esc(t('weeklyTag')) : ''}</div>
      ${i.change ? `<div class="s">${i.change === 'extra' ? '➕ ' + esc(t('extraLesson')) : '🔁 ' + esc(t('movedFrom', { d: fmtDate(i.movedFrom.date, { weekday: 'short', day: 'numeric', month: 'short', year: false }) }))}</div>` : ''}</div>
      <span class="pill ${ST_CLS[i.status] || 'i'}" style="margin-top:0">${i.status === 'moved' && i.movedTo ? '→ ' + fmtDate(i.movedTo.date, { weekday: 'short', day: 'numeric', month: 'short', year: false }) + ' ' + esc(i.movedTo.start) : esc(t(WK_LABEL[i.status] || i.status))}</span>${chev}</div>`;
  }).join('')}</div>` : `<div class="list"><div class="empty">${esc(t(items.length ? 'dayEmpty' : 'weekEmpty'))}</div></div>`;
  html += `<div class="navgrid" style="margin-top:4px"><button data-act="go" data-v="indnew"><span class="e">👤</span>${esc(t('newIndTitle'))}</button><button data-act="go" data-v="trialnew"><span class="e">🎓</span>${esc(t('bookTrial'))}</button></div>`;
  return html;
}
function openWeekItem(idx) {
  const d = state.sd || {};
  const W = state.wk;
  const items = (d.items || []).filter(i => !W.teacher || i.teacher === W.teacher || i.usualTeacher === W.teacher);
  const i = items[idx];
  if (!i) return;
  if (i.kind === 'trial') openStaff('trial', { id: i.trialId });
  else if (i.kind === 'group') openStaff('lesson', { group: i.group, date: i.date });
  else openStaff('lesson', { group: 'Individual', date: i.date, studentId: i.studentId });
}

      <div class="main"><div class="t">${fmtDate(l.date, { weekday: 'short', day: 'numeric', month: 'short' })}</div>
      <div class="s">${canc ? esc(t('cancelled')) : esc(t('markedN', { m: l.marked, n: l.total })) + (l.absent ? ' · ' + esc(t('absentN', { n: l.absent })) : '')}</div></div>${chev}</div>`;
    }).join('') || `<div class="empty">${esc(t('noLessons'))}</div>`}</div>`;
  return html;
}

/* ---------- one lesson: mark attendance, cancel, delete a planned individual lesson ---------- */
const ATT = ['present', 'late', 'absent', 'excused'];
const ATT_LABEL = { present: 'stPresent', late: 'stLate', absent: 'stAbsent', excused: 'stExcused' };
function lessonEditor() {
  const L = state.lesson;
  if (!L) return '';
  const ind = L.group === 'Individual';
  const marked = L.entries.some(e => e.status && e.status !== 'cancelled');
  let html = `<div class="h1">${esc(ind ? t('indLessonWith') : t('lessonOf') + ' · ' + L.group)}</div>
    <div class="sub">${ind ? esc(L.entries[0].name) + (L.teacher ? ' · ' + esc(L.teacher) : '') + (L.series ? ' · 🔁 ' + esc(t('weeklyTag')) : '') : fmtDate(L.date, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="field"><label>${esc(t('date'))}</label><input class="inp" type="date" data-lf="date" value="${esc(L.date)}"></div>
    <div class="formgrid"><div class="field"><label>${esc(t('startTime'))}</label>${timeInp('data-lf="start"', L.start)}</div>
    <div class="field"><label>${esc(t('endTime'))}</label>${timeInp('data-lf="end"', L.end)}</div></div>`;
  if (L.movedTo) {
    return html.split('<div class="field"><label>')[0] + `<div class="banner"><div class="t">🔁 ${esc(t('movedTo', { d: fmtDate(L.movedTo.date, { weekday: 'long', day: 'numeric', month: 'long' }) + ' ' + L.movedTo.start }))}</div>${L.movedTo.note ? `<div class="muted" style="margin-top:4px">${esc(L.movedTo.note)}</div>` : ''}</div>
      <button class="btn" data-act="lopen" data-date="${esc(L.movedTo.date)}">${esc(t('openThat'))}</button>
      ${L.canAssign ? `<div class="actions"><button class="link-danger" style="color:var(--link)" data-act="lundo">${esc(t('undoMove'))}</button></div>` : ''}`;
  }
  if (L.moveMode) return html + moveFormHtml(L);
  html += lessonChangeHtml(L, marked);
  if (L.cancelled) {
    const why = (L.entries.find(e => e.comment) || {}).comment;
    return html + `<div class="banner"><div class="t">🚫 ${esc(t('cancelledBanner'))}</div>${why ? `<div style="margin-top:4px;font-style:italic">“${esc(why)}”</div>` : ''}<div class="muted" style="margin-top:6px">${esc(t('cancelledNote'))}</div></div>

      <div class="hint muted">${esc(t('subHint', { name: L.usualTeacher || '' }))}</div></div>
      <div class="field"><label>${esc(t('subReason'))}</label><input class="inp" data-lf="subWhy" maxlength="200" value="${esc(L.subWhy || '')}"></div>
      <button class="btn" data-act="sub-save" ${state.busy ? 'disabled' : ''}>${esc(t('saveBtn'))}</button>
      <div style="text-align:center;margin-top:8px"><button class="link-danger" style="color:var(--link)" data-act="sub-mode-off">${esc(t('cancel'))}</button></div></div>`;
  }
  if (L.tchMode) {
    return html + `<div class="card"><div class="h1" style="font-size:17px;margin-bottom:10px">${esc(t('tchTitle'))}</div>
      <div class="field"><select class="sel" data-lf="tchPick"><option value="">${esc(t('choose'))}</option>${(L.allTeachers || []).filter(n => n !== L.teacher).map(n => `<option ${L.tchPick === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <div class="hint muted">${esc(t('tchHint'))}</div></div>
      ${L.series ? `<button class="btn" style="margin-bottom:8px" data-act="tch-save" data-v="series" ${state.busy ? 'disabled' : ''}>${esc(t('tchSeries'))}</button>
      <button class="btn ghost" data-act="tch-save" data-v="one" ${state.busy ? 'disabled' : ''}>${esc(t('tchOne'))}</button>`
      : `<button class="btn" data-act="tch-save" data-v="one" ${state.busy ? 'disabled' : ''}>${esc(t('saveBtn'))}</button>`}
      <div style="text-align:center;margin-top:8px"><button class="link-danger" style="color:var(--link)" data-act="tch-mode-off">${esc(t('cancel'))}</button></div></div>`;
  }
  if (L.substitute || L.canAssign) {
    html += `<div class="subline ${L.substitute ? 'on' : ''}"><span>👤 ${L.substitute ? esc(t('subBy', { name: L.substitute })) + (L.usualTeacher ? ' · ' + esc(t('subFor', { name: L.usualTeacher })) : '') + (L.subReason ? ` · <i>${esc(L.subReason)}</i>` : '') : esc(t('taughtBy', { name: L.usualTeacher || '—' }))}</span>
      ${L.canAssign ? `<button class="mini-btn" data-act="sub-mode">${esc(t(L.substitute ? 'changeBtn' : 'setSub'))}</button>` : ''}</div>`;

function numOrNull(v) { return v === '' || v == null || isNaN(Number(v)) ? null : Number(v); }
function lessonTimes(L) {
  const start = normTime(L.start), end = normTime(L.end);
  if (start === null || end === null || (start && end && end <= start)) { toast(t('badTime')); return null; }
  return { start, end };
}
async function saveLessonWith(entries, okMsg) {
  const L = state.lesson;
  const tm = lessonTimes(L);
  if (!tm) return;
  state.busy = true; render();
  try {
    const r = await api('lesson_save', { group: L.group, date: L.date, start: tm.start, end: tm.end, entries: entries });
    haptic('success');
    toast((okMsg || (r.absenceAlerts ? t('savedAbs', { n: r.absenceAlerts }) : t('saved'))) + sentNote(r));
    state.busy = false;
    if (state.svStack.length) { const prev = state.svStack.pop(); await openStaff(prev.name, prev, false, { top: true }); return; }
  } catch (e) { haptic('error'); toast(t(e.code || 'server_error')); }
  state.busy = false; render();
}
function saveLesson() {
  const L = state.lesson;
  for (const e of L.entries) {
    for (const k of ['homework', 'mark']) {
      const v = e[k];
      if (v !== '' && v != null && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > 100)) { toast(t('bad_request')); return; }
    }
    if (e.status === 'late' && normTime(e.arrival) === null) { toast(t('badTime')); return; }
  }
  return saveLessonWith(L.entries.map(e => ({ studentId: e.studentId, status: e.status || '', arrival: e.status === 'late' ? normTime(e.arrival) || '' : '',
    homework: numOrNull(e.homework), mark: numOrNull(e.mark), comment: e.comment || '' })));
}
function cancelLesson() {
  const L = state.lesson;
  return saveLessonWith(L.entries.map(e => ({ studentId: e.studentId, status: 'cancelled', comment: (L.reason || '').trim() })), t('cancelledSaved'));
}
async function undoCancel() {
  if (!(await confirmBox(t('undoConfirm')))) return;
  return saveLessonWith(state.lesson.entries.map(e => ({ studentId: e.studentId, status: '', comment: '' })));
}
async function saveSub() {

/* ---------- plan individual lessons: once or every week ---------- */
function newPick(d) {
  const from = todayIso(1);
  return { students: d.students || [], teachers: d.teachers || [], id: '', mode: 'once', date: from, from: from, until: addDays(from, 27), days: [], start: '', end: '', teacher: '' };
}
function pickDates(P) {
  if (P.mode !== 'weekly') return P.date ? [P.date] : [];
  if (!P.from || !P.until || P.until < P.from || !P.days.length) return [];
  const out = [];
  for (let d = P.from, k = 0; d <= P.until && k < 400; d = addDays(d, 1), k++) if (P.days.includes(wdIdx(d))) out.push(d);
  return out;
}

async function createInd() {

async function saveGroup() {
  const G = state.gf;
  const name = G.name.trim().replace(/\s+/g, ' ');
  if (!name || name.length > 20 || /[,·]/.test(name)) { toast(t('bad_group_name')); return; }
  const slots = [];
  for (const x of G.slots) {
    if (!x.start && !x.end) continue;
    const a = normTime(x.start), b = normTime(x.end);
    if (!a || !b || b <= a) { toast(t('badTime')); return; }
    slots.push({ day: x.day, start: a, end: b, room: x.room || '' });
  }
  const fee = String(G.fee).replace(/[\s ,]/g, '');
  if (fee && !/^\d+$/.test(fee)) { toast(t('bad_request')); return; }
  state.busy = true; render();
  try {
    const res = await api('group_save', { isNew: G.isNew, name: name, level: G.level, course: G.course, teacher: G.teacher, room: G.room, fee: fee === '' ? '' : Number(fee), slots: slots });
    state.sd = res; state.gf = groupFormState(res); state.sv.group = res.group.name;
    haptic('success'); toast(t('groupSaved'));
  } catch (e) { toast(t(e.code || 'server_error')); }
  state.busy = false; render();
}

/* ---------- clash warnings: ask, then save anyway ---------- */
async function apiClash(action, payload) {
  try { return await api(action, payload); }
  catch (e) {
    if (e.code !== 'clash') throw e;
    const lines = (e.clashes || []).map(c => `• ${fmtDate(c.date, { weekday: 'short', day: 'numeric', month: 'short', year: false })} ${c.start}–${c.end} ${c.what} (${c.reason === 'room' ? t('clashRoom') + ' ' + c.room : t('clashTeacher') + ' ' + c.teacher})`);
    if (!(await confirmBox(t('clashTitle') + '\n' + lines.join('\n') + '\n\n' + t('saveAnyway')))) { const x = codeErr('clash_cancel'); x.silent = true; throw x; }
    return api(action, Object.assign({}, payload, { force: true }));
  }
}
function errToast(e) { if (!e.silent) toast(t(e.code || 'server_error')); }
function sentNote(r) { return r && r.messages ? '\n' + t('msgsSent', { n: r.messages }) : ''; }

function regClientCheck(R) {
  const bad = [];
  const ph = p => String(p || '').replace(/\D/g, '').length >= 9;
  if (R.studentName.trim().length < 2) bad.push('studentName');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(R.dob) || R.dob > todayIso()) bad.push('dob');
  if (R.contactThrough !== 'Student') { if (R.parentName.trim().length < 2) bad.push('parentName'); if (!ph(R.parentPhone)) bad.push('parentPhone'); }
  if (R.contactThrough !== 'Parent' && !ph(R.studentPhone)) bad.push('studentPhone');
  if (!R.consent) bad.push('consent');
  return bad;
}
async function submitReg() {
  const R = state.reg;
  state.regBad = regClientCheck(R);
  if (state.regBad.length) { haptic('error'); render(); const el = document.querySelector('.bad'); if (el) el.scrollIntoView({ block: 'center' }); return; }
  state.busy = true; render();
  try {
    const form = Object.assign({}, R, { days: R.days.join(', '), time: R.time.join(', ') });
    if (R.contactThrough === 'Student') { form.parentName = ''; form.parentPhone = ''; form.parentTelegram = ''; form.parentRelation = ''; }
    if (R.contactThrough === 'Parent') { form.studentPhone = ''; form.studentTelegram = ''; }
    const res = await api('register', { form: form });
    if (state.data) state.data.registrations = res.registrations;
    state.regDone = true; state.reg = null; haptic('success');
  } catch (e) {
    if (e.fields) state.regBad = e.fields;
    toast(t(e.code || 'server_error')); haptic('error');
  }
  state.busy = false; render();
}

    Object.assign(g, { level: extra.level, course: extra.course, teacher: extra.teacher, room: extra.room, fee: extra.fee === '' ? null : extra.fee, slots: extra.slots });
    g.schedule = demoSchedule(g);
    return demoGroupForm(g.name);
  }
  if (action === 'group_students') {
    (extra.add || []).forEach(id => { demoRow(id)[2] = extra.group; if (!DEMO_LOG[id]) DEMO_LOG[id] = []; });
    (extra.remove || []).forEach(id => { demoRow(id)[2] = ''; });
    return demoGroupForm(extra.group);
  }
  if (action === 'group_delete') {
    if (DEMO_ROSTER.some(r => r[2] === extra.group)) throw codeErr('group_not_empty');
    DEMO_GROUPS.splice(DEMO_GROUPS.findIndex(g => g.name === extra.group), 1);
    return { ok: true, deleted: extra.group };
  }
  throw codeErr('bad_action');
}

/* ---------------- start ---------------- */
if (IN_TELEGRAM) {
  try {
    tg.ready();
    tg.expand();
    tg.BackButton.onClick(goBack);
  } catch (e) {}
}
render();
load(false);
</script>

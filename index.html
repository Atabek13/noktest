<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Fallback colours for demo mode outside Telegram. Inside Telegram the
     user's own theme (--tg-theme-*) is used automatically. */
  :root {
    --f-bg: #eff1f5; --f-card: #ffffff; --f-text: #12161f; --f-hint: #7b8494;
    --f-accent: #2481cc; --f-accent-text: #ffffff; --f-danger: #e5484d; --f-sep: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --f-bg: #0e1015; --f-card: #1a1d24; --f-text: #eef0f4; --f-hint: #8a93a3;
            --f-accent: #4ea4f6; --f-accent-text: #ffffff; --f-danger: #ff6b6e; --f-sep: rgba(255,255,255,.08); }
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-card)));
    --text: var(--tg-theme-text-color, var(--f-text));
    --hint: var(--tg-theme-hint-color, var(--f-hint));
    --accent: var(--tg-theme-button-color, var(--f-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--f-accent-text));
    --link: var(--tg-theme-link-color, var(--accent));
    --danger: var(--tg-theme-destructive-text-color, var(--f-danger));
    --sep: var(--f-sep);
    --good: #22a25a; --good-bg: rgba(34,162,90,.14);
    --mid: #d18a0b;  --mid-bg: rgba(209,138,11,.15);
    --bad: #e5484d;  --bad-bg: rgba(229,72,77,.14);
    --info: #6b7cff; --info-bg: rgba(107,124,255,.15);
    --hw: #c060e0;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .hint { color: var(--hint); }
  .muted { color: var(--hint); font-size: 13px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; }
  .school { font-weight: 600; font-size: 14px; color: var(--hint); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .langs { display: flex; background: var(--card); border-radius: 10px; padding: 2px; }
  .langs button { padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--hint); border-radius: 8px; }
  .langs button.on { background: var(--accent); color: var(--accent-text); }
  .icon-btn { width: 32px; height: 32px; border-radius: 10px; background: var(--card); display: grid; place-items: center; color: var(--hint); }
  .icon-btn svg { width: 18px; height: 18px; }
  .spin svg { animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .demo { background: var(--info-bg); color: var(--text); border-radius: 12px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }

  /* child switcher */
  .kids { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
  .kids::-webkit-scrollbar { display: none; }
  .kid { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: 14px; }
  .kid.on { background: var(--accent); color: var(--accent-text); }

  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

  /* hero */
  .hero { display: flex; gap: 14px; align-items: center; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
  .name { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--text); }
  .tag.warn { background: var(--mid-bg); color: var(--mid); }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--sep); }
  .info .k { font-size: 12px; color: var(--hint); }
  .info .v { font-weight: 500; overflow-wrap: anywhere; }
  .info .wide { grid-column: 1 / -1; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 10px; }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .stat .cmp { font-size: 12px; color: var(--hint); margin-top: 6px; }
  .stat .cmp b { color: var(--text); font-weight: 600; }
  .bar { height: 4px; border-radius: 4px; background: var(--bg); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }

  .note .k { font-size: 12px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }

  /* tabs */
  .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 2; box-shadow: 0 0 0 8px var(--bg); }
  .tabs button { flex: 1; padding: 8px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); position: relative; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .dot { display: inline-block; min-width: 18px; padding: 0 5px; height: 18px; line-height: 18px; border-radius: 9px; font-size: 11px; background: var(--danger); color: #fff; margin-left: 4px; vertical-align: 1px; }

  /* lists */
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .row { padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; }
  .row .s { font-size: 13px; color: var(--hint); }
  .row .c { font-size: 13px; margin-top: 4px; font-style: italic; color: var(--text); opacity: .85; }
  .score { text-align: right; flex: none; }
  .score .big { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 3px; }
  .g { color: var(--good); background: var(--good-bg); }
  .m { color: var(--mid); background: var(--mid-bg); }
  .b { color: var(--bad); background: var(--bad-bg); }
  .i { color: var(--info); background: var(--info-bg); }
  .empty { padding: 28px 16px; text-align: center; color: var(--hint); }

  .att-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .att-sum span { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; }

  .chart { padding: 14px 16px 10px; }
  .chart .k { font-size: 12px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; }
  .chart svg { display: block; width: 100%; height: 96px; margin-top: 8px; overflow: visible; }
  .chart .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 4px; }

  .news .t { font-size: 16px; }
  .news .msg { margin-top: 6px; white-space: pre-wrap; }

  /* actions */
  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px; }
  .btn:disabled { opacity: .6; }
  .btn.ghost { background: var(--card); color: var(--link); }
  .link-danger { color: var(--danger); font-size: 14px; padding: 6px; }

  /* connect screen */
  .connect { text-align: center; padding-top: 6vh; }
  .connect .badge { width: 76px; height: 76px; border-radius: 24px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; margin: 0 auto 18px; }
  .connect .badge svg { width: 40px; height: 40px; }
  .connect h1 { font-size: 22px; margin: 0 0 6px; }
  .connect p { margin: 0 auto 22px; color: var(--hint); max-width: 320px; }
  .code { width: 100%; padding: 15px; font: 600 24px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .25em; text-align: center; text-transform: uppercase;
    background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 14px; outline: none; margin-bottom: 12px; }
  .code:focus { border-color: var(--accent); }
  .code::placeholder { letter-spacing: .05em; font-size: 16px; color: var(--hint); font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 10px; }

  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--hint); }
  .loader { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--card); border-top-color: var(--accent); animation: rot .8s linear infinite; margin: 0 auto 12px; }
  /* lessons */
  .lesson .when { font-weight: 600; }
  .lesson .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
  .lesson .nums { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex: none; }
  .num { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .num span { font-weight: 500; opacity: .8; margin-right: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--hint); margin-top: 10px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .chart svg.big { height: 170px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .mtable { table-layout: fixed; }
  .mtable th { font-size: 11px; font-weight: 600; color: var(--hint); text-align: right; padding: 10px 10px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtable th:first-child, .mtable td:first-child { text-align: left; }
  .mtable td { padding: 9px 10px; text-align: right; border-top: 1px solid var(--sep); }
  .mtable th:first-child, .mtable td:first-child { width: 34%; padding-left: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
 *  SETTINGS — paste your Apps Script web app URL here
 *  (Google Sheet → Extensions → Apps Script → Deploy → Web app URL,
 *   it ends with /exec)
 * ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzpprV_c6ONQkFEdzoNBSiMHWvpkILpT_jnOAOACsrC4qzjqy8pAOVI0CZUNnoIur3USA/exec';
/* ============================================================ */

const tg = window.Telegram && window.Telegram.WebApp;
const IN_TELEGRAM = !!(tg && tg.initData);
const DEMO = !IN_TELEGRAM;

/* ---------------- translations ---------------- */
const T = {
  en: {
    connectTitle: 'Connect your child', connectText: 'Enter the access code you received from the school.',
    placeholder: 'e.g. K7M2QX', connect: 'Connect', connecting: 'Connecting…', cancel: 'Cancel',
    bad_code: 'Code not found. Please check it and try again.', too_many_attempts: 'Too many attempts. Please wait 10 minutes.',
    unauthorized: "Please open this app from the school's Telegram bot.", session_expired: 'Session expired — close and reopen the app.',

    server_error: 'Something went wrong. Please try again.', bad_action: 'Something went wrong. Please try again.', retry: 'Try again',
    loading: 'Loading…', teacher: 'Teacher', schedule: 'Schedule', room: 'Room', since: 'Student since',
    attendance: 'Attendance', homework: 'Homework', mark: 'Average mark', lateTimes: 'Times late',
    groupAvg: 'Group', avgLate: 'avg {n} min', lessons: 'Lessons', progress: 'Progress', news: 'News',
    noLessons: 'No lessons yet.', noNews: 'No announcements.', noProgress: 'Progress appears after the first lessons.',
    present: 'Present', absent: 'Absent', late: 'Late', excused: 'Excused', minLate: '+{n} min',
    hwShort: 'HW', markShort: 'Mark', attShort: 'Attend.', month: 'Month', byMonth: 'Progress by month', markLine: 'Mark', hwLine: 'Homework', attLine: 'Attendance',
    schoolNote: 'Note from the school', addChild: 'Add another child',
    remove: 'Remove {name} from this app', removeConfirm: 'Remove {name}? You can connect again later with the access code.',
    demo: "Demo mode — open the app from the school's Telegram bot to see real data. Try codes K7M2QX or J6RV2T.",
    paused: 'Paused', finished: 'Finished', active: 'Active', forGroup: 'For {group}'
  },
  ru: {
    connectTitle: 'Подключите ребёнка', connectText: 'Введите код доступа, который вы получили в школе.',
    placeholder: 'например, K7M2QX', connect: 'Подключить', connecting: 'Подключаем…', cancel: 'Отмена',
    bad_code: 'Код не найден. Проверьте его и попробуйте ещё раз.', too_many_attempts: 'Слишком много попыток. Подождите 10 минут.',
    unauthorized: 'Откройте приложение через Telegram-бота школы.', session_expired: 'Сессия устарела — закройте и снова откройте приложение.',
    not_configured: 'Школа ещё не завершила настройку приложения.', network: 'Нет связи с сервером. Проверьте интернет и попробуйте снова.',
    server_error: 'Что-то пошло не так. Попробуйте ещё раз.', bad_action: 'Что-то пошло не так. Попробуйте ещё раз.', retry: 'Повторить',
    loading: 'Загрузка…', teacher: 'Преподаватель', schedule: 'Расписание', room: 'Кабинет', since: 'Учится с',
    attendance: 'Посещаемость', homework: 'Домашние задания', mark: 'Средняя оценка', lateTimes: 'Опозданий',
    groupAvg: 'Группа', avgLate: 'в среднем {n} мин', lessons: 'Уроки', progress: 'Прогресс', news: 'Новости',
    noLessons: 'Пока нет уроков.', noNews: 'Объявлений нет.', noProgress: 'Прогресс появится после первых уроков.',
    present: 'На уроке', absent: 'Пропуск', late: 'Опоздание', excused: 'Уваж. причина', minLate: '+{n} мин',
    hwShort: 'ДЗ', markShort: 'Оценка', attShort: 'Посещ.', month: 'Месяц', byMonth: 'Прогресс по месяцам', markLine: 'Оценка', hwLine: 'ДЗ', attLine: 'Посещаемость',
    schoolNote: 'Комментарий школы', addChild: 'Добавить ещё ребёнка',
    remove: 'Убрать из приложения: {name}', removeConfirm: 'Убрать {name} из приложения? Подключить снова можно по коду доступа.',
    demo: 'Демо-режим — откройте приложение через Telegram-бота школы, чтобы увидеть реальные данные. Коды для проверки: K7M2QX, J6RV2T.',
    paused: 'Пауза', finished: 'Окончил(а)', active: 'Учится', forGroup: 'Для группы {group}'
  },
  uz: {
    connectTitle: 'Farzandingizni ulang', connectText: 'Maktabdan olgan kirish kodingizni kiriting.',
    placeholder: 'masalan, K7M2QX', connect: 'Ulash', connecting: 'Ulanmoqda…', cancel: 'Bekor qilish',
    bad_code: "Kod topilmadi. Tekshirib, qayta urinib ko'ring.", too_many_attempts: "Juda ko'p urinish. Iltimos, 10 daqiqa kuting.",
    unauthorized: 'Iltimos, ilovani maktabning Telegram boti orqali oching.', session_expired: 'Sessiya muddati tugadi — ilovani yopib, qayta oching.',
    not_configured: "Maktab ilovani hali to'liq sozlamagan.", network: "Serverga ulanib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.",
    server_error: "Xatolik yuz berdi. Qayta urinib ko'ring.", bad_action: "Xatolik yuz berdi. Qayta urinib ko'ring.", retry: 'Qayta urinish',
    loading: 'Yuklanmoqda…', teacher: "O'qituvchi", schedule: 'Jadval', room: 'Xona', since: "O'qishni boshlagan",
    attendance: 'Davomat', homework: 'Uy vazifalari', mark: "O'rtacha baho", lateTimes: 'Kechikishlar',
    groupAvg: 'Guruh', avgLate: "o'rtacha {n} daqiqa", lessons: 'Darslar', progress: 'Natijalar', news: 'Yangiliklar',
    noLessons: "Hozircha darslar yo'q.", noNews: "E'lonlar yo'q.", noProgress: "Natijalar birinchi darslardan keyin ko'rinadi.",
    present: 'Keldi', absent: 'Kelmadi', late: 'Kechikdi', excused: 'Sababli', minLate: '+{n} daq',
    hwShort: 'UV', markShort: 'Baho', attShort: 'Davomat', month: 'Oy', byMonth: 'Oylar bo\'yicha natijalar', markLine: 'Baho', hwLine: 'Uy vazifasi', attLine: 'Davomat',
    schoolNote: 'Maktabdan izoh', addChild: "Yana bir farzandni qo'shish",
    remove: 'Ilovadan olib tashlash: {name}', removeConfirm: "{name} ilovadan olib tashlansinmi? Keyinroq kirish kodi bilan qayta ulashingiz mumkin.",
    demo: "Demo rejim — haqiqiy ma'lumotlarni ko'rish uchun ilovani maktabning Telegram botidan oching. Sinov kodlari: K7M2QX, J6RV2T.",
    paused: "To'xtatilgan", finished: 'Tugatgan', active: 'Faol', forGroup: '{group} guruhi uchun'
  }
};
const LOCALE = { en: 'en-GB', ru: 'ru-RU', uz: 'uz-Latn-UZ' };

/* ---------------- state ---------------- */
const store = {
  get(k) { try { return localStorage.getItem('school_' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('school_' + k, v); } catch (e) {} }
};
const state = {
  lang: store.get('lang') || detectLang(),
  data: null,
  kid: store.get('kid') || null,
  tab: 'lessons',
  view: 'loading',     // loading | connect | dash | error
  error: null,
  busy: false,
  refreshing: false,
  lastCode: ''
};
function detectLang() {
  const c = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'en').toLowerCase();
  return c.startsWith('ru') ? 'ru' : c.startsWith('uz') ? 'uz' : 'en';
}
function t(key, vars) {
  let s = (T[state.lang] && T[state.lang][key]) || T.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- API ---------------- */
async function api(action, extra) {
  if (DEMO) return demoApi(action, extra || {});
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) throw codeErr('not_configured');
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple" request: no CORS preflight
      body: JSON.stringify(Object.assign({ action: action, initData: tg.initData }, extra || {})),
      redirect: 'follow'
    });
  } catch (e) { throw codeErr('network'); }
  let data;
  try { data = await res.json(); } catch (e) { throw codeErr('server_error'); }
  if (!data.ok) throw codeErr(data.error || 'server_error');
  return data;
}
function codeErr(code) { const e = new Error(code); e.code = code; return e; }

/* ---------------- flows ---------------- */
async function load(isRefresh) {
  if (isRefresh) { state.refreshing = true; render(); }
  try {
    const data = await api('me');
    setData(data);
    state.view = data.students.length ? 'dash' : 'connect';
  } catch (e) {
    if (!isRefresh || !state.data) { state.view = 'error'; state.error = e.code || 'server_error'; }
    else toast(t(e.code || 'server_error'));
  }
  state.refreshing = false;
  render();
}

function setData(data) {
  state.data = data;
  const ids = data.students.map(s => s.id);
  if (!ids.includes(state.kid)) state.kid = ids[0] || null;
  if (state.kid) store.set('kid', state.kid);
}

async function connect(code) {
  state.busy = true; state.error = null; render();
  try {
    const data = await api('link', { code: code });
    setData(data);
    if (data.linkedStudentId) { state.kid = data.linkedStudentId; store.set('kid', state.kid); }
    state.view = 'dash'; state.tab = 'lessons';
    haptic('success');
    askWriteAccess();
  } catch (e) {
    state.error = e.code || 'server_error';
    haptic('error');
  }
  state.busy = false;
  render();
}

async function removeKid(kid) {
  const s = state.data.students.find(x => x.id === kid);
  const ok = await confirmBox(t('removeConfirm', { name: s ? s.name : '' }));
  if (!ok) return;
  try {
    const data = await api('unlink', { studentId: kid });
    setData(data);
    state.view = data.students.length ? 'dash' : 'connect';
  } catch (e) { toast(t(e.code || 'server_error')); }
  render();
}

/* ---------------- Telegram helpers ---------------- */
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function askWriteAccess() {
  // lets the school bot send lesson reports to this parent
  try { if (tg.isVersionAtLeast('6.9')) tg.requestWriteAccess(function () {}); } catch (e) {}
}
function confirmBox(msg) {
  return new Promise(resolve => {
    try { if (IN_TELEGRAM && tg.isVersionAtLeast('6.2')) { tg.showConfirm(msg, resolve); return; } } catch (e) {}
    resolve(window.confirm(msg));
  });
}
function toast(msg) {
  try { if (IN_TELEGRAM && tg.isVersionAtLeast('6.2')) { tg.showAlert(msg); return; } } catch (e) {}
  alert(msg);
}
function syncBackButton() {
  if (!IN_TELEGRAM || !tg.BackButton) return;
  try {
    const canGoBack = state.view === 'connect' && state.data && state.data.students.length;
    canGoBack ? tg.BackButton.show() : tg.BackButton.hide();
  } catch (e) {}
}

/* ---------------- formatting ---------------- */
const UZ_MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const UZ_MONTHS_SHORT = ['yan', 'fev', 'mar', 'apr', 'may', 'iyn', 'iyl', 'avg', 'sen', 'okt', 'noy', 'dek'];
const UZ_DAYS = ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Jum', 'Shan'];
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, m[3] ? +m[3] : 1) : null;
}
function fmtDate(s, opts) {
  const d = parseDate(s);
  if (!d) return esc(s || '');
  const o = Object.assign({ day: 'numeric', month: 'short' }, opts || {});
  if (o.day === false) delete o.day;
  if (d.getFullYear() !== new Date().getFullYear() && o.year !== false) o.year = 'numeric';
  if (o.year === false) delete o.year;
  if (state.lang === 'uz') return fmtUz(d, o);   // many phones lack Uzbek month names
  try { return new Intl.DateTimeFormat(LOCALE[state.lang], o).format(d); }
  catch (e) { return s; }
}
function fmtUz(d, o) {
  const m = o.month === 'long' ? UZ_MONTHS[d.getMonth()] : UZ_MONTHS_SHORT[d.getMonth()];
  let s = o.day ? d.getDate() + '-' + m : m;
  if (o.year) s = o.day ? s + ' ' + d.getFullYear() : d.getFullYear() + ' ' + s;
  if (o.weekday) s = UZ_DAYS[d.getDay()] + ', ' + s;
  return s;
}
function monthLabel(ym, long) { return fmtDate(ym, { day: false, month: long ? 'long' : 'short', year: false }); }
function tone(pct) { return pct == null ? 'i' : pct >= 80 ? 'g' : pct >= 60 ? 'm' : 'b'; }
function toneColor(pct) { return pct == null ? 'var(--info)' : pct >= 80 ? 'var(--good)' : pct >= 60 ? 'var(--mid)' : 'var(--bad)'; }
function initials(name) { return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function statusLabel(st) { const k = String(st || '').toLowerCase(); return T.en[k] ? t(k) : st; }
function pctText(n) { return n == null ? '—' : Math.round(n) + '%'; }

/* ---------------- views ---------------- */
const ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>';
const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>';

function topBar(showRefresh) {
  const school = (state.data && state.data.school) || 'School';
  return `<div class="top">
    <div class="school">${esc(school)}</div>
    <div class="langs">${['en', 'ru', 'uz'].map(l => `<button data-lang="${l}" class="${l === state.lang ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div>
    ${showRefresh ? `<button class="icon-btn ${state.refreshing ? 'spin' : ''}" data-act="refresh" aria-label="Refresh">${ICON_REFRESH}</button>` : ''}
  </div>${DEMO ? `<div class="demo">${esc(t('demo'))}</div>` : ''}`;
}

function viewLoading() {
  return `<div class="center"><div><div class="loader"></div>${esc(t('loading'))}</div></div>`;
}

function viewError() {
  return topBar(false) + `<div class="center"><div>
    <div style="font-size:40px;margin-bottom:8px">⚠️</div>
    <div style="color:var(--text);max-width:300px;margin:0 auto 18px">${esc(t(state.error))}</div>
    ${state.error === 'unauthorized' ? '' : `<button class="btn" style="width:auto;display:inline-block;padding:12px 26px" data-act="retry">${esc(t('retry'))}</button>`}
  </div></div>`;
}

function viewConnect() {
  const hasKids = state.data && state.data.students.length;
  return topBar(false) + `<div class="connect">
    <div class="badge">${ICON_BOOK}</div>
    <h1>${esc(t('connectTitle'))}</h1>
    <p>${esc(t('connectText'))}</p>
    <form id="codeForm" autocomplete="off">
      <input class="code" id="code" value="${esc(state.lastCode || '')}" maxlength="12" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="${esc(t('placeholder'))}">
      <div class="err">${state.error ? esc(t(state.error)) : ''}</div>
      <button class="btn" type="submit" ${state.busy ? 'disabled' : ''}>${esc(t(state.busy ? 'connecting' : 'connect'))}</button>
    </form>
    ${hasKids ? `<div class="actions"><button class="link-danger" style="color:var(--link)" data-act="back">${esc(t('cancel'))}</button></div>` : ''}
  </div>`;
}

function viewDash() {
  const kids = state.data.students;
  const s = kids.find(k => k.id === state.kid) || kids[0];
  const news = state.data.announcements;
  const st = s.stats || {};
  const status = String(s.status || '').toLowerCase();

  let html = topBar(true);
  if (kids.length > 1) {
    html += `<div class="kids">${kids.map(k => `<button class="kid ${k.id === s.id ? 'on' : ''}" data-kid="${esc(k.id)}">${esc(k.name.split(' ')[0])}</button>`).join('')}</div>`;
  }

  html += `<div class="card">
    <div class="hero">
      <div class="avatar">${esc(initials(s.name))}</div>
      <div style="min-width:0">
        <div class="name">${esc(s.name)}</div>
        <div class="tags">
          ${s.level ? `<span class="tag">${esc(s.level)}</span>` : ''}
          ${s.group ? `<span class="tag">${esc(s.group)}</span>` : ''}
          ${status && status !== 'active' ? `<span class="tag warn">${esc(statusLabel(s.status))}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="info">
      ${s.teacher ? `<div><div class="k">${esc(t('teacher'))}</div><div class="v">${esc(s.teacher)}</div></div>` : ''}
      ${s.room ? `<div><div class="k">${esc(t('room'))}</div><div class="v">${esc(s.room)}</div></div>` : ''}
      ${s.schedule ? `<div class="wide"><div class="k">${esc(t('schedule'))}</div><div class="v">${esc(s.schedule)}</div></div>` : ''}
      ${s.startDate ? `<div class="wide"><div class="k">${esc(t('since'))}</div><div class="v">${fmtDate(s.startDate, { month: 'long', year: 'numeric' })}</div></div>` : ''}
    </div>
  </div>`;

  const tile = (value, label, pct, cmp) => `<div class="stat">
    <div class="n">${value}</div><div class="l">${esc(label)}</div>
    ${pct !== undefined ? `<div class="bar"><i style="width:${pct == null ? 0 : Math.max(0, Math.min(100, pct))}%;background:${toneColor(pct)}"></i></div>` : ''}
    ${cmp ? `<div class="cmp">${cmp}</div>` : ''}
  </div>`;
  const grp = v => v == null ? '' : `${esc(t('groupAvg'))}: <b>${Math.round(v)}%</b>`;
  html += `<div class="stats">
    ${tile(pctText(st.attendanceRate), t('attendance'), st.attendanceRate)}
    ${tile(st.late || 0, t('lateTimes'), undefined, st.avgMinutesLate ? esc(t('avgLate', { n: Math.round(st.avgMinutesLate) })) : '')}
    ${tile(pctText(st.homework), t('homework'), st.homework, grp(st.groupHomework))}
    ${tile(pctText(st.mark), t('mark'), st.mark, grp(st.groupMark))}
  </div>`;

  if (s.comment) html += `<div class="card note"><div class="k">${esc(t('schoolNote'))}</div><div>${esc(s.comment)}</div></div>`;

  html += `<div class="tabs">
    <button data-tab="lessons" class="${state.tab === 'lessons' ? 'on' : ''}">${esc(t('lessons'))}</button>
    <button data-tab="progress" class="${state.tab === 'progress' ? 'on' : ''}">${esc(t('progress'))}</button>
    <button data-tab="news" class="${state.tab === 'news' ? 'on' : ''}">${esc(t('news'))}${news.length && state.tab !== 'news' ? `<span class="dot">${news.length}</span>` : ''}</button>
  </div>`;

  if (state.tab === 'lessons') html += tabLessons(s);
  else if (state.tab === 'progress') html += tabProgress(s);
  else html += tabNews(news);

  html += `<div class="actions">
    <button class="btn ghost" data-act="add">＋ ${esc(t('addChild'))}</button>
    <button class="link-danger" data-act="remove" data-id="${esc(s.id)}">${esc(t('remove', { name: s.name.split(' ')[0] }))}</button>
  </div>`;
  return html;
}

function tabLessons(s) {
  const ls = s.lessons || [];
  if (!ls.length) return `<div class="list"><div class="empty">${esc(t('noLessons'))}</div></div>`;
  const cls = { present: 'g', late: 'm', absent: 'b', excused: 'i' };
  return `<div class="list">${ls.map(l => `<div class="row lesson">
    <div class="main">
      <div class="when">${fmtDate(l.date, { weekday: 'short', day: 'numeric', month: 'short' })}</div>
      <div class="meta">
        <span class="pill ${cls[l.status] || 'i'}" style="margin-top:0">${esc(T.en[l.status] ? t(l.status) : l.status)}${l.status === 'late' && l.minutesLate ? ' · ' + esc(t('minLate', { n: l.minutesLate })) : ''}</span>
        ${l.start ? `<span class="muted">${esc(l.start)}${l.status === 'late' && l.arrival ? ' → ' + esc(l.arrival) : ''}</span>` : ''}
      </div>
      ${l.comment ? `<div class="c" style="font-size:13px;margin-top:6px;font-style:italic;opacity:.85">“${esc(l.comment)}”</div>` : ''}
    </div>
    <div class="nums">
      ${l.homework != null ? `<span class="num ${tone(l.homework)}"><span>${esc(t('hwShort'))}</span>${Math.round(l.homework)}%</span>` : ''}
      ${l.mark != null ? `<span class="num ${tone(l.mark)}"><span>${esc(t('markShort'))}</span>${Math.round(l.mark)}%</span>` : ''}
    </div>
  </div>`).join('')}</div>`;
}

function tabProgress(s) {
  const ms = s.monthly || [];
  const st = s.stats || {};
  if (!ms.length) return `<div class="list"><div class="empty">${esc(t('noProgress'))}</div></div>`;
  let html = `<div class="list chart"><div class="k">${esc(t('byMonth'))}</div>${monthChart(ms)}
    <div class="legend">
      <span><i style="background:var(--accent)"></i>${esc(t('markLine'))}</span>
      <span><i style="background:var(--hw)"></i>${esc(t('hwLine'))}</span>
      <span><i style="background:var(--good)"></i>${esc(t('attLine'))}</span>
    </div></div>`;
  html += `<div class="att-sum">
    <span class="g">${esc(t('present'))}: ${st.present || 0}</span>
    <span class="m">${esc(t('late'))}: ${st.late || 0}</span>
    <span class="b">${esc(t('absent'))}: ${st.absent || 0}</span>
    <span class="i">${esc(t('excused'))}: ${st.excused || 0}</span>
  </div>`;
  html += `<div class="list"><table class="mtable"><thead><tr>
      <th>${esc(t('month'))}</th><th>${esc(t('attShort'))}</th><th>${esc(t('hwShort'))}</th><th>${esc(t('markShort'))}</th></tr></thead>
    <tbody>${ms.slice().reverse().map(m => `<tr>
      <td>${monthLabel(m.month, true)}</td>
      <td><span class="num ${tone(m.attendance)}">${pctText(m.attendance)}</span></td>
      <td><span class="num ${tone(m.homework)}">${pctText(m.homework)}</span></td>
      <td><span class="num ${tone(m.mark)}">${pctText(m.mark)}</span></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}

function monthChart(ms) {
  const W = 320, H = 170, L = 30, R = 10, Tp = 10, B = 24;
  const n = ms.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  const y = v => Tp + (H - Tp - B) * (1 - v / 100);
  const series = [['mark', 'var(--accent)', ''], ['homework', 'var(--hw)', ''], ['attendance', 'var(--good)', '4 4']];
  let g = '';
  [0, 50, 100].forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--hint)">${v}</text>`;
  });
  ms.forEach((m, i) => { g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--hint)">${esc(monthLabel(m.month))}</text>`; });
  series.forEach(([key, color, dash]) => {
    const pts = ms.map((m, i) => m[key] == null ? null : [x(i), y(m[key])]).filter(Boolean);
    if (pts.length > 1) g += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    pts.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>`; });
  });
  return `<svg class="big" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('byMonth'))}">${g}</svg>`;
}

function tabNews(list) {
  if (!list.length) return `<div class="list"><div class="empty">${esc(t('noNews'))}</div></div>`;
  return list.map(a => `<div class="card news">
    <div class="s muted">${fmtDate(a.date, { day: 'numeric', month: 'long' })}${a.audience && a.audience.toLowerCase() !== 'all' ? ` · ${esc(t('forGroup', { group: a.audience }))}` : ''}</div>
    <div class="t" style="font-weight:700;margin-top:2px">${esc(a.title)}</div>
    <div class="msg">${esc(a.message)}</div>
  </div>`).join('');
}

/* ---------------- render + events ---------------- */
const app = document.getElementById('app');
function render() {
  document.documentElement.lang = state.lang;
  const v = state.view;
  app.innerHTML = v === 'loading' ? viewLoading() : v === 'error' ? viewError() : v === 'connect' ? viewConnect() : viewDash();
  syncBackButton();
  if (v === 'connect') {
    const input = document.getElementById('code');
    if (input && !state.busy) setTimeout(() => input.focus(), 50);
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) { state.lang = b.dataset.lang; store.set('lang', state.lang); render(); return; }
  if (b.dataset.kid) { state.kid = b.dataset.kid; store.set('kid', state.kid); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.tab) { state.tab = b.dataset.tab; render(); return; }
  const act = b.dataset.act;
  if (act === 'refresh' && !state.refreshing) load(true);
  if (act === 'retry') { state.view = 'loading'; render(); load(false); }
  if (act === 'add') { state.view = 'connect'; state.error = null; state.lastCode = ''; render(); }
  if (act === 'back') { state.view = 'dash'; state.error = null; render(); }
  if (act === 'remove') removeKid(b.dataset.id);
});
app.addEventListener('submit', e => {
  if (e.target.id !== 'codeForm') return;
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  state.lastCode = code;
  if (code && !state.busy) connect(code);
});

/* ---------------- demo data (used only outside Telegram) ---------------- */
function demoLessons(seed, days, startH, profile) {
  let x = seed;
  const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  const out = [];
  const comments = ['Very active today.', 'Well prepared.', 'Revise today\'s vocabulary.', '', '', 'Great speaking.', 'Check spelling.'];
  for (let d = new Date(2026, 8, 1); d <= new Date(2026, 9, 28); d.setDate(d.getDate() + 1)) {
    if (!days.includes(d.getDay())) continue;
    const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const start = `${startH}:00`;
    if (rnd() > profile.att) { out.push({ date, status: rnd() < 0.3 ? 'excused' : 'absent', start, arrival: '', minutesLate: null, homework: null, mark: null, comment: '' }); continue; }
    const late = rnd() < profile.late, mins = late ? [5, 10, 12, 15][Math.floor(rnd() * 4)] : null;
    out.push({ date, status: late ? 'late' : 'present', start, arrival: late ? `${startH}:${String(mins).padStart(2, '0')}` : '', minutesLate: mins,
      homework: Math.min(100, Math.max(0, Math.round((profile.hw + (rnd() - 0.5) * 30) / 10) * 10)),
      mark: Math.min(100, Math.max(0, Math.round(profile.mark + (rnd() - 0.5) * 20))), comment: comments[Math.floor(rnd() * comments.length)] });
  }
  return out.reverse();
}
function demoStats(lessons) {
  const c = { present: 0, late: 0, absent: 0, excused: 0 };
  lessons.forEach(l => c[l.status]++);
  const avg = a => { const n = a.filter(v => v != null); return n.length ? Math.round(n.reduce((p, q) => p + q, 0) / n.length) : null; };
  const counted = c.present + c.late + c.absent;
  return Object.assign({ lessons: lessons.length, attendanceRate: counted ? Math.round((c.present + c.late) / counted * 100) : null,
    avgMinutesLate: avg(lessons.filter(l => l.status === 'late').map(l => l.minutesLate)),
    homework: avg(lessons.map(l => l.homework)), mark: avg(lessons.map(l => l.mark)) }, c);
}
function demoStudent(base, lessons, groupHw, groupMark) {
  const stats = Object.assign(demoStats(lessons), { groupHomework: groupHw, groupMark: groupMark });
  const months = {};
  lessons.forEach(l => (months[l.date.slice(0, 7)] = months[l.date.slice(0, 7)] || []).push(l));
  const monthly = Object.keys(months).sort().map(m => { const st = demoStats(months[m]); return { month: m, attendance: st.attendanceRate, homework: st.homework, mark: st.mark, lessons: st.lessons }; });
  return Object.assign(base, { stats, monthly, lessons });
}

function demoApi(action, extra) {
  return new Promise((resolve, reject) => setTimeout(() => {
    const c = String(extra.code || '').toUpperCase().replace(/[\s-]/g, '');
    if (action === 'link') {
      if (!DEMO_DB.students[c]) return reject(codeErr('bad_code'));
      if (!demoLinked.includes(c)) demoLinked.push(c);
    }
    if (action === 'unlink') demoLinked = demoLinked.filter(k => DEMO_DB.students[k].id !== extra.studentId);
    const students = demoLinked.map(k => DEMO_DB.students[k]);
    const groups = students.map(s => s.group.toLowerCase());
    const out = { ok: true, school: DEMO_DB.school, students: students,
      announcements: students.length ? DEMO_DB.announcements.filter(a => a.audience === 'All' || groups.includes(a.audience.toLowerCase())) : [] };
    if (action === 'link') out.linkedStudentId = DEMO_DB.students[c].id;
    resolve(out);
  }, 450));
}
